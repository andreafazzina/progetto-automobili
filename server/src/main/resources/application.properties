# ===== Identità dell'applicazione =====
spring.application.name=server

# ===== Connessione a PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/automobili
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== Comportamento di Hibernate/JPA =====
# 'update': mantiene tabella e dati tra un riavvio e l'altro.
# Coerente con "importa il CSV una volta": al primo avvio la tabella
# è vuota e l'importer la popola; ai riavvii successivi i dati restano.
spring.jpa.hibernate.ddl-auto=update

# Mostra le query SQL generate (utile in sviluppo, si disattiva in produzione)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Segreto per la firma HMAC. In produzione andrebbe in variabile
# d'ambiente e generato casualmente ad alta entropia.
jwt.secret=${JWT_SECRET:ESupq+9xe9ItG4DYWWfe3KhQSYOsqrN8Wjvv9Tkj0P4=}
jwt.issuer=progetto-automobili
jwt.expiration-ms=3600000

