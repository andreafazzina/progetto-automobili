<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analisi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="topbar">
        <span class="brand"><a href="/" style="color:#fff;">Automobili</a></span>
        <span><a href="/logout">Esci</a></span>
    </div>

    <div class="container">
        <div class="nav-actions">
            <a href="javascript:history.back()" class="btn btn-ghost">&larr; Indietro</a>
            <a href="/" class="btn btn-ghost">&#8962; Home</a>
        </div>

        <div class="card">
            <form th:action="@{/analysis}" method="get" class="form-inline">
                <div>
                    <label for="type">Tipo di analisi</label>
                    <select name="type">
                        <option value="ALL" th:selected="${selectedType == 'ALL'}">Tutte le analisi</option>
                        <option th:each="t : ${types}"
                                th:value="${t}" 
                                th:text="${t.displayName}"
                                th:selected="${t.name() == selectedType}">TIPO</option>
                    </select>
                </div>
                <div>
                    <label for="make">Marca</label>
                    <select id="make" name="make">
                        <option value="" th:selected="${selectedMake == null or selectedMake.isEmpty()}">
                            Tutte le marche
                        </option>
                        <option th:each="brand : ${brands}"
                                th:value="${brand.make}" th:text="${brand.make}"
                                th:selected="${brand.make == selectedMake}">Marca</option>
                    </select>
                </div>
                <button type="submit">Esegui</button>
            </form>
        </div>

        <div th:if="${results}" th:each="result : ${results}" class="card">
            <h2 th:text="${result.title}">Risultato</h2>
            <table>
                <thead>
                    <tr><th th:text="${result.key}">X</th><th th:text="${result.value}">Y</th></tr>
                </thead>
                <tbody>
                    <tr th:each="point : ${result.data}">
                        <td th:text="${point.key}">-</td>
                        <td th:text="${point.value}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
